name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # pinned (not ubuntu-latest): 24.04's apt espeak-ng is 1.51, the version the paper used
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11: the minimum the inference/test path supports; 3.12: the paper runs
        # (pyproject.toml requires >=3.12 for the paper-building scripts)
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: System packages (espeak-ng for the phonemizer test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng libsndfile1
          espeak-ng --version

      - name: Python packages (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas soundfile librosa safetensors huggingface_hub phonemizer pytest

      - name: Unit tests (no network)
        run: pytest -m "not network" -q tests
