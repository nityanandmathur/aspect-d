# ASPECT-D: packaging metadata and dependency declaration.
#
# The code is NOT an importable package: scripts are run as `python src/<script>.py`
# (each script puts src/ on its own path). Installing this project only installs the
# dependencies:
#
#     pip install -e ".[eval,analysis]"        # or: uv pip install -e ".[eval,analysis]"
#
# For the exact versions used in the paper runs, install requirements.txt instead.
# Lower bounds below are the versions the paper used (or the closest reconstruction);
# older versions are untested.
#
# System dependency (not on PyPI): espeak-ng (the paper used 1.51), required by
# phonemizer for the text front end. Linux: `apt install espeak-ng`; macOS:
# `brew install espeak-ng`.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aspect-d"
version = "1.5.0"
description = "Refinement Buys Intelligibility, Search Buys Identity: what test-time compute buys in masked-diffusion TTS (DiffuLM @ NeurIPS 2026 workshop)."
readme = "README.md"
# src/paper.py and src/make_audit_page.py use PEP 701 f-strings (backslashes inside
# f-string expressions), which do not parse before Python 3.12. The paper ran on 3.12.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nityanand Mathur" },
    { name = "Hamees Sayed" },
    { name = "Ayush Pratap Singh" },
]
keywords = ["text-to-speech", "masked diffusion", "test-time compute", "scaling laws", "speech"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core: data pipeline (src/data.py), model (src/model.py), training (src/train.py),
# sampling (src/sample.py), and loading the released checkpoints.
dependencies = [
    "torch>=2.11",
    "numpy>=2.0",
    "pandas>=3.0",
    "pyarrow>=15",            # parquet I/O for data/proc/*.parquet
    "transformers>=5.14,<6",  # transformers.MimiModel (kyutai/mimi codec)
    "soundfile>=0.12",
    "librosa>=0.10",
    "phonemizer>=3.2",        # needs the espeak-ng system package
    "huggingface_hub>=1.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# Scoring: WER (Whisper-large-v3 via transformers + jiwer), SIM-o (WavLM-large SV head,
# loaded from ASPECTD_MODELS/wavlm_sv; its WavLM front end comes from torch.hub
# s3prl/s3prl), UTMOS22 (torch.hub tarepan/SpeechMOS:v1.2.0), and the encoder-swap
# gates (speechbrain ECAPA / x-vector, resemblyzer GE2E). `data.py select` also needs
# this extra (it transcribes eval candidates).
eval = [
    # torchaudio 2.11.0 is its last release and does not pin torch; without this upper
    # bound a resolver pairs it with torch 2.14, whose ABI its compiled extension does
    # not match (and which the paper never used). Keep torch and torchaudio on 2.11.
    "torch>=2.11,<2.12",
    "torchaudio>=2.11,<2.12",
    "jiwer>=3.0",
    "speechbrain>=1.0",
    "resemblyzer>=0.1.4",
    "setuptools<82",          # webrtcvad (via resemblyzer) imports pkg_resources, removed in setuptools 82
]
# Fits, bootstrap analyses and figures (src/fit.py, src/figures.py, src/*_analysis.py).
analysis = [
    "scipy>=1.11",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/nityanandmathur/aspect-d"
Paper = "https://openreview.net/forum?id=E659lrDKOx"
Models = "https://huggingface.co/nityanandmathur/aspect-d-masked-diffusion-tts"

[tool.setuptools]
# Scripts only; nothing to install as a module.
packages = []
py-modules = []

[tool.uv]
# Scripts repo: `uv run` should not build/sync a project venv from this file. Install the
# pinned paper environment explicitly instead:
#     uv venv --python 3.12 && uv pip install -r requirements.txt
managed = false

[tool.pytest.ini_options]
testpaths = ["tests"]
